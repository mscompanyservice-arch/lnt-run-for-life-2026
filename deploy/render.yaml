# Optional Render Blueprint (managed hosting). Review Render's current pricing before applying — nothing is purchased by this file.
services:
  - type: web
    name: lnt-run-2026
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: lnt-run-db, property: connectionString }
      - key: APP_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: TRUST_PROXY
        value: "1"
databases:
  - name: lnt-run-db
