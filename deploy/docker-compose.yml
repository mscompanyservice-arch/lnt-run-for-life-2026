# Single-server deployment: app + PostgreSQL + Caddy (automatic HTTPS).
# Usage on the server:  cp ../.env.example .env  (edit values)  then  docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: lnt
      POSTGRES_USER: lnt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
  app:
    build: ..
    restart: unless-stopped
    depends_on: [db]
    environment:
      DATABASE_URL: postgres://lnt:${POSTGRES_PASSWORD}@db:5432/lnt
      APP_SECRET: ${APP_SECRET:?set APP_SECRET in .env}
      COOKIE_SECURE: "true"
      TRUST_PROXY: "1"
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?set SITE_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [app]
volumes:
  pgdata:
  caddy_data:
